<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Create Account — Matgari</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/auth.css" />
  </head>
  <body>
    <div class="auth-shell">
      <a class="auth-brand-header" href="/index.html" id="auth-logo">
        <i class="fa-solid fa-bag-shopping" style="color: #FF9900;"></i>
        <span data-store-name>Matgari</span>
        <span class="tld">.com</span>
      </a>

      <div class="auth-card" id="register-card" style="max-width: 440px;">
        <h2>Create Account</h2>
        <p class="auth-subtitle">Quick details to activate your account and track your orders</p>
        <form id="register-form">
          <div class="field">
            <label for="reg-name">Full Name</label>
            <input class="input" id="reg-name" name="name" required autocomplete="name" placeholder="e.g. John Doe" />
          </div>
          <div class="field">
            <label for="reg-email">Email Address</label>
            <input class="input" id="reg-email" type="email" name="email" required autocomplete="email" placeholder="example@domain.com" />
          </div>
          <div class="field">
            <label for="reg-password">Password (at least 8 characters)</label>
            <input class="input" id="reg-password" type="password" name="password" minlength="8" required autocomplete="new-password" placeholder="••••••••" />
          </div>
          <div class="field">
            <label for="reg-phone">Delivery Phone Number</label>
            <input class="input" id="reg-phone" name="phone_number" required placeholder="+2010XXXXXXXX" />
          </div>
          <div class="field">
            <label for="reg-whatsapp">WhatsApp Number for Fast Communication</label>
            <input class="input" id="reg-whatsapp" name="whatsApp_number" required placeholder="+2010XXXXXXXX" />
          </div>
          <div class="field">
            <label for="reg-gps">Delivery Location Link / Detailed Address</label>
            <input class="input" id="reg-gps" type="url" name="GPS_URL" required placeholder="https://maps.google.com/..." />
          </div>
          <button class="auth-submit" id="register-submit-btn" type="submit">Create Account and Continue</button>
        </form>
        <p class="auth-disclaimer">
          By creating an account, you acknowledge and agree to Matgari's <a href="#">Conditions of Use & Sale</a> and <a href="#">Privacy Notice</a>.
        </p>
      </div>

      <div class="auth-switch-divider" style="max-width: 440px;">
        <span>Already have an account?</span>
      </div>

      <a href="/login.html" class="auth-secondary-btn" id="login-account-link" style="max-width: 440px;">
        Sign in to your account
      </a>

      <div class="auth-footer">
        <p>© Matgari — Certified E-commerce Platform</p>
      </div>
    </div>
    <script type="module" src="/js/pages/register.page.js"></script>
  </body>
</html>
